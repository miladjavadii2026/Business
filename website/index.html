  <style>
    /* ---------- Design tokens ---------- */
    :root {
      --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --surface-2: #F0EDE5;
      --ink: #0F1B2D;
      --ink-2: #364255;
      --muted: #5E6A79;
      --line: #E2DDD2;
      --accent: #0E7C66;
      --accent-soft: rgba(14, 124, 102, 0.12);

      --navy: #0B1628;
      --navy-2: #12213A;
      --on-navy: #F3F1EC;
      --on-navy-muted: #A9B4C4;
      --navy-line: rgba(255, 255, 255, 0.10);
      --gold: #2BA38A;

      --shadow: 0 1px 2px rgba(15, 27, 45, 0.04), 0 10px 30px rgba(15, 27, 45, 0.06);
      --radius: 14px;
      --maxw: 1160px;
      --gutter: clamp(16px, 4vw, 40px);
      --header-h: 68px;

      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0A111D; --surface: #101A2A; --surface-2: #0D1624; --ink: #ECEFF4; --ink-2: #C5CDD8;
        --muted: #8E9AAB; --line: #1F2B3E; --accent: #2FBFA0; --accent-soft: rgba(47, 191, 160, 0.12);
        --navy: #070E1A; --navy-2: #0E1A2E; --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.25);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0A111D; --surface: #101A2A; --surface-2: #0D1624; --ink: #ECEFF4; --ink-2: #C5CDD8;
      --muted: #8E9AAB; --line: #1F2B3E; --accent: #2FBFA0; --accent-soft: rgba(47, 191, 160, 0.12);
      --navy: #070E1A; --navy-2: #0E1A2E; --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.25);
      color-scheme: dark;
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 12px); -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans);
      font-size: 1.0625rem; line-height: 1.65; -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility; overflow-x: hidden;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    p { margin: 0 0 1em; }
    h1, h2, h3, h4 { margin: 0; font-family: var(--font-serif); font-weight: 500; letter-spacing: -0.015em; word-spacing: 0.06em; line-height: 1.15; }
    ul, ol, dl, dd { margin: 0; padding: 0; }
    li { list-style: none; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

    .container { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    .skip-link {
      position: absolute; left: 16px; top: -48px; z-index: 100;
      background: var(--gold); color: #0B1628; padding: 10px 16px; border-radius: 8px; font-weight: 600;
      transition: top .2s ease;
    }
    .skip-link:focus { top: 12px; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 48px; padding: 0 22px; border-radius: 999px;
      font: 600 0.95rem/1 var(--font-sans); letter-spacing: 0.005em;
      border: 1px solid transparent; cursor: pointer;
      transition: transform .2s ease, background-color .2s ease, border-color .2s ease, color .2s ease;
    }
    .btn .icon { width: 18px; height: 18px; transition: transform .2s ease; }
    .btn:hover .icon-arrow { transform: translateX(3px); }
    .btn-gold { background: var(--gold); color: #0B1628; }
    .btn-gold:hover { background: #33B99C; }
    .btn-ghost { border-color: rgba(255, 255, 255, 0.24); color: var(--on-navy); }
    .btn-ghost:hover { border-color: rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.04); }
    .btn-sm { min-height: 40px; padding: 0 18px; font-size: 0.9rem; }

    /* ---------- Header ---------- */
    .site-header { position: sticky; top: 0; z-index: 50; background: var(--navy); border-bottom: 1px solid var(--navy-line); color: var(--on-navy); }
    .nav { display: flex; align-items: center; gap: 24px; height: var(--header-h); }
    .brand { display: inline-flex; align-items: center; gap: 12px; margin-right: auto; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(43, 163, 138, 0.55); color: var(--gold); font: 500 1.05rem/1 var(--font-serif); letter-spacing: 0.02em; }
    .brand-name { font: 500 1.2rem/1 var(--font-serif); letter-spacing: 0; word-spacing: 0.12em; }

    .nav-links { display: flex; gap: 4px; }
    .nav-links a { display: inline-block; padding: 8px 12px; border-radius: 8px; font-size: 0.92rem; font-weight: 500; color: var(--on-navy-muted); transition: color .2s ease, background-color .2s ease; }
    .nav-links a:hover, .nav-links a[aria-current="true"] { color: var(--on-navy); background: rgba(255, 255, 255, 0.06); }

    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: transparent; color: var(--on-navy-muted); border: 1px solid var(--navy-line); cursor: pointer; transition: color .2s ease, border-color .2s ease; }
    .icon-btn:hover { color: var(--on-navy); border-color: rgba(255, 255, 255, 0.3); }
    .theme-toggle .i-sun { display: none; }
    .theme-toggle[data-mode="dark"] .i-sun { display: block; }
    .theme-toggle[data-mode="dark"] .i-moon { display: none; }
    .menu-toggle { display: none; }
    .nav-mobile-only { display: none; }
    .menu-toggle .i-close { display: none; }
    .site-header.is-open .menu-toggle .i-close { display: block; }
    .site-header.is-open .menu-toggle .i-menu { display: none; }

    @media (max-width: 960px) {
      .menu-toggle { display: grid; }
      .nav-cta { display: none; }
      .nav-mobile-only { display: list-item; }
      .nav-links { position: absolute; left: 0; right: 0; top: var(--header-h); flex-direction: column; gap: 0; padding: 8px var(--gutter) 20px; background: var(--navy); border-bottom: 1px solid var(--navy-line); display: none; }
      .site-header.is-open .nav-links { display: flex; }
      .nav-links a { display: block; padding: 14px 4px; border-radius: 0; font-size: 1.05rem; border-bottom: 1px solid var(--navy-line); background: none !important; }
      .nav-links li:last-child a { border-bottom: 0; }
    }

    /* ---------- Hero ---------- */
    .hero { position: relative; overflow: hidden; isolation: isolate; background: var(--navy); color: var(--on-navy); padding: clamp(64px, 9vw, 120px) 0 clamp(72px, 10vw, 128px); }
    .hero::before {
      content: ""; position: absolute; inset: 0; z-index: -2;
      background-image: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 70% 40%, #000 30%, transparent 75%);
      mask-image: radial-gradient(ellipse 80% 70% at 70% 40%, #000 30%, transparent 75%);
    }
    .hero::after { content: ""; position: absolute; z-index: -2; width: 720px; height: 720px; right: -220px; top: -260px; background: radial-gradient(circle, rgba(43, 163, 138, 0.20), transparent 62%); pointer-events: none; }
    .hero-curve { position: absolute; z-index: -1; right: -2%; bottom: -6%; width: min(44%, 620px); opacity: 0.5; pointer-events: none; }

    .hero-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.9fr); gap: clamp(40px, 6vw, 88px); align-items: center; }
    .eyebrow-dark { display: inline-flex; align-items: center; gap: 12px; margin: 0 0 28px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
    .eyebrow-dark::before { content: ""; width: 28px; height: 1px; background: currentColor; }

    .hero-title { font-weight: 400; }
    .hero-name { display: block; margin-bottom: 18px; font: 500 clamp(1.15rem, 2vw, 1.35rem)/1.2 var(--font-sans); letter-spacing: 0; color: var(--on-navy-muted); }
    .hero-headline { display: block; font-size: clamp(2.2rem, 5vw, 3.85rem); line-height: 1.06; letter-spacing: -0.025em; word-spacing: 0; }
    .hero-headline em { font-style: italic; color: var(--gold); }
    .hero-lead { max-width: 36em; margin: 28px 0 36px; font-size: clamp(1.05rem, 1.5vw, 1.2rem); line-height: 1.6; color: var(--on-navy-muted); }
    .hero-lead strong { color: var(--on-navy); font-weight: 500; }

    .hero-roles { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 22px 0 0; min-height: 1.6em; }
    .hero-roles-label { font-size: 0.92rem; color: var(--on-navy-muted); }
    .hero-roles-word { display: inline-block; font: 600 1.05rem/1.3 var(--font-sans); color: var(--gold); transition: opacity .35s ease, transform .35s ease; }
    .js .hero-roles-word.is-swapping { opacity: 0; transform: translateY(6px); }

    .hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    .hero-meta { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 36px; font-size: 0.92rem; color: var(--on-navy-muted); }
    .hero-meta span { display: inline-flex; align-items: center; gap: 8px; }
    .hero-meta .icon { width: 17px; height: 17px; color: var(--gold); }

    .track-switch { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 30px 0 0; }
    .track-switch-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--on-navy-muted); margin-right: 2px; }
    .track-switch a { display: inline-flex; align-items: center; min-height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--navy-line); font-size: 0.86rem; font-weight: 500; color: var(--on-navy-muted); transition: color .2s ease, border-color .2s ease, background-color .2s ease; }
    .track-switch a:hover, .track-switch a:focus-visible { color: var(--on-navy); border-color: rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.05); }
    .track-switch a[aria-current="true"] { color: #0B1628; background: var(--gold); border-color: var(--gold); }

    .hero-portrait { position: relative; }
    .hero-portrait-frame { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 4 / 5; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(43, 163, 138, 0.25); }
    .hero-portrait-frame img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
    .hero-portrait-badge { position: absolute; left: 18px; right: 18px; bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-radius: 14px; background: rgba(10, 17, 29, 0.74); border: 1px solid var(--navy-line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .hero-portrait-badge .value { font: 500 1.5rem/1 var(--font-serif); color: var(--on-navy); letter-spacing: -0.01em; }
    .hero-portrait-badge .label { margin-top: 4px; font-size: 0.76rem; color: var(--on-navy-muted); }

    @media (max-width: 960px) {
      .hero-grid { grid-template-columns: 1fr; }
      .hero-portrait { max-width: 420px; }
      .hero-curve { width: 90%; opacity: 0.35; }
    }

    /* ---------- Executive proof bar ---------- */
    .proof-bar { background: var(--navy-2); border-top: 1px solid var(--navy-line); border-bottom: 1px solid var(--navy-line); }
    .proof-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .proof-item { padding: 28px 20px; text-align: center; border-left: 1px solid var(--navy-line); }
    .proof-item:first-child { border-left: 0; }
    .proof-value { display: block; font: 500 clamp(1.7rem, 2.8vw, 2.3rem)/1 var(--font-serif); letter-spacing: -0.02em; color: var(--on-navy); font-variant-numeric: lining-nums; }
    .proof-label { display: block; margin-top: 8px; font-size: 0.76rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--on-navy-muted); }

    @media (max-width: 860px) {
      .proof-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .proof-item:nth-child(2n+1) { border-left: 0; }
      .proof-item { border-top: 1px solid var(--navy-line); }
      .proof-item:nth-child(-n+2) { border-top: 0; }
    }
    @media (max-width: 480px) { .proof-grid { grid-template-columns: 1fr 1fr; } }

    /* ---------- Organizations band ---------- */
    .orgs { background: var(--navy-2); color: var(--on-navy-muted); border-top: 1px solid var(--navy-line); }
    .orgs .container { display: flex; align-items: center; gap: 20px 40px; padding-top: 26px; padding-bottom: 26px; flex-wrap: wrap; }
    .orgs-label { margin: 0; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; white-space: nowrap; }
    .orgs ul { display: flex; flex-wrap: wrap; gap: 10px 32px; }
    .orgs li { font: 500 1.08rem/1.3 var(--font-serif); word-spacing: 0.06em; color: rgba(243, 241, 236, 0.78); }

    /* ---------- Sections ---------- */
    .section { padding: clamp(72px, 10vw, 128px) 0; }
    .section-alt { background: var(--surface-2); }
    .section-head { max-width: 760px; margin-bottom: clamp(36px, 5vw, 56px); }
    .eyebrow { display: inline-flex; align-items: center; gap: 12px; margin: 0 0 18px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
    .eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; }
    .section-title { font-size: clamp(1.9rem, 3.4vw, 2.7rem); line-height: 1.12; letter-spacing: -0.02em; }
    .section-title em { font-style: italic; color: var(--accent); }
    .section-lead { margin: 18px 0 0; font-size: 1.12rem; color: var(--muted); max-width: 40em; }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

    /* ---------- About ---------- */
    .about-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: clamp(32px, 6vw, 80px); align-items: start; }
    .about-copy p { font-size: 1.12rem; color: var(--ink-2); }
    .about-copy p:first-child { font: 400 clamp(1.3rem, 2vw, 1.5rem)/1.45 var(--font-serif); color: var(--ink); letter-spacing: -0.01em; }
    .about-copy strong { font-weight: 600; color: var(--ink); }
    .about-panel { padding: clamp(24px, 3vw, 32px); }
    .about-panel h3 { font-size: 1.3rem; margin-bottom: 18px; }
    .focus-list li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-weight: 500; }
    .focus-list li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
    .facts { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
    .fact dt { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .fact dd { margin-top: 2px; font-size: 0.98rem; }

    @media (max-width: 860px) { .about-grid { grid-template-columns: 1fr; } }

    /* ---------- Expertise ---------- */
    .cap-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .cap { padding: 28px; transition: transform .25s ease, border-color .25s ease; }
    .cap:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
    .cap-icon { display: grid; place-items: center; width: 46px; height: 46px; margin-bottom: 22px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
    .cap-icon .icon { width: 22px; height: 22px; }
    .cap h3 { font-size: 1.3rem; margin-bottom: 10px; }
    .cap p { margin: 0; color: var(--muted); font-size: 0.98rem; }

    .tools { margin-top: clamp(40px, 5vw, 56px); display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 16px 32px; padding-top: 32px; border-top: 1px solid var(--line); }
    .tools h3 { font: 600 0.78rem/1.6 var(--font-sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); padding-top: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { display: inline-flex; align-items: center; min-height: 34px; padding: 4px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 0.9rem; font-weight: 500; color: var(--ink-2); }

    @media (max-width: 960px) { .cap-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 620px) { .cap-grid { grid-template-columns: 1fr; } .tools { grid-template-columns: 1fr; } }

    /* ---------- Approach ---------- */
    .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); }

    function getTrack() {
      var params = new URLSearchParams(window.location.search);
      var t = params.get("track");
      return TRACKS.indexOf(t) !== -1 ? t : "pricing";
    }

    function updateHead(cfg, track) {
      document.title = cfg.docTitle;
      var d = document.getElementById("meta-description"); if (d) d.setAttribute("content", cfg.metaDescription);
      var ogt = document.getElementById("og-title"); if (ogt) ogt.setAttribute("content", cfg.docTitle);
      var ogd = document.getElementById("og-description"); if (ogd) ogd.setAttribute("content", cfg.metaDescription);
      var twt = document.getElementById("tw-title"); if (twt) twt.setAttribute("content", cfg.docTitle);
      var twd = document.getElementById("tw-description"); if (twd) twd.setAttribute("content", cfg.metaDescription);
      var canonicalUrl = "https://www.miladjavadi.com/" + (track === "pricing" ? "" : "?track=" + track);
      var can = document.getElementById("link-canonical"); if (can) can.setAttribute("href", canonicalUrl);
      var ogu = document.getElementById("og-url"); if (ogu) ogu.setAttribute("content", canonicalUrl);

      var ld = document.getElementById("ld-person");
      if (ld) {
        try {
          var data = JSON.parse(ld.textContent);
          data.jobTitle = cfg.jsonLdJobTitle;
          data.description = cfg.metaDescription;
          data.url = canonicalUrl;
          ld.textContent = JSON.stringify(data);
        } catch (e) {}
      }
    }

    function render() {
      var track = getTrack();
      var cfg = CONFIG[track];
      var app = document.getElementById("app");
      if (!app) return;

      var html = renderNav(cfg, track) + '<main id="main">' + renderHero(cfg, track);
      cfg.sectionOrder.forEach(function (key) {
        var fn = SECTION_RENDERERS[key];
        if (fn) html += fn(cfg);
      });
      html += '</main>' + renderContact(cfg) + renderFooter();

      app.innerHTML = html;
      updateHead(cfg, track);
      wireInteractions(cfg);
    }

    function wireInteractions(cfg) {
      var root = document.documentElement;

      // Theme toggle
      var toggle = document.querySelector("[data-theme-toggle]");
      var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      function effectiveTheme() {
        var t = root.getAttribute("data-theme");
        if (t) return t;
        return mq && mq.matches ? "dark" : "light";
      }
      function syncToggle() {
        if (!toggle) return;
        var dark = effectiveTheme() === "dark";
        toggle.setAttribute("data-mode", dark ? "dark" : "light");
        toggle.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      }
      if (toggle) {
        toggle.addEventListener("click", function () {
          var next = effectiveTheme() === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          try { localStorage.setItem("mj-theme", next); } catch (e) {}
          syncToggle();
        });
      }
      if (mq && mq.addEventListener) mq.addEventListener("change", syncToggle);
      syncToggle();

      // Mobile menu
      var header = document.querySelector(".site-header");
      var menuBtn = document.querySelector(".menu-toggle");
      function setMenu(open) {
        if (!header || !menuBtn) return;
        header.classList.toggle("is-open", open);
        menuBtn.setAttribute("aria-expanded", String(open));
        menuBtn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      }
      if (menuBtn) menuBtn.addEventListener("click", function () { setMenu(!header.classList.contains("is-open")); });
      document.querySelectorAll(".nav-links a").forEach(function (a) {
        a.addEventListener("click", function () { setMenu(false); });
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && header && header.classList.contains("is-open")) { setMenu(false); menuBtn.focus(); }
      });

      // Reveal on scroll
      var items = document.querySelectorAll(".reveal");
      if ("IntersectionObserver" in window) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) { entry.target.classList.add("is-visible"); io.unobserve(entry.target); }
          });
        }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
        items.forEach(function (el) { io.observe(el); });
      } else {
        items.forEach(function (el) { el.classList.add("is-visible"); });
      }

      // Nav spy
      var links = {};
      document.querySelectorAll(".nav-links a[href^='#']").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
      if ("IntersectionObserver" in window) {
        var spy = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            Object.keys(links).forEach(function (k) { links[k].removeAttribute("aria-current"); });
            var link = links[entry.target.id];
            if (link) link.setAttribute("aria-current", "true");
          });
        }, { rootMargin: "-45% 0px -50% 0px" });
        document.querySelectorAll("main section[id]").forEach(function (s) { spy.observe(s); });
      }

      // Footer year
      var y = document.querySelector("[data-year]");
      if (y) y.textContent = new Date().getFullYear();

      var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Rotating role descriptor in hero
      var roleWord = document.querySelector("[data-role-rotator]");
      if (roleWord && !reduceMotion && cfg.roles.length > 1) {
        var roles = cfg.roles;
        var ri = 0;
        setInterval(function () {
          roleWord.classList.add("is-swapping");
          setTimeout(function () {
            ri = (ri + 1) % roles.length;
            roleWord.textContent = roles[ri];
            roleWord.classList.remove("is-swapping");
          }, 350);
        }, 2600);
      }

      // Count-up for proof-bar metrics
      var counters = document.querySelectorAll("[data-count-to]");
      function animateCount(el) {
        if (reduceMotion) return;
        var to = parseFloat(el.getAttribute("data-count-to"));
        var prefix = el.getAttribute("data-prefix") || "";
        var suffix = el.getAttribute("data-suffix") || "";
        var start = null;
        var duration = 1200;
        function frame(ts) {
          if (!start) start = ts;
          var p = Math.min((ts - start) / duration, 1);
          var eased = 1 - Math.pow(1 - p, 3);
          var val = Math.round(to * eased);
          el.textContent = prefix + val.toLocaleString("en-US") + suffix;
          if (p < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }
      if (counters.length && "IntersectionObserver" in window) {
        var countIO = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) { animateCount(entry.target); countIO.unobserve(entry.target); }
          });
        }, { threshold: 0.6 });
        counters.forEach(function (el) { countIO.observe(el); });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", render);
    } else {
      render();
    }
  })();
